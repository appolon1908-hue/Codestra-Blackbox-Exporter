name: codestra-blackbox-exporter

services:
  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:?BLACKBOX_EXPORTER_IMAGE must be an immutable image digest}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --web.listen-address=0.0.0.0:9115
      - --web.external-url=https://blac.codestra.media
      - --history.limit=0
      - --log.level=info
      - --log.format=json
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - codestra_observability
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  codestra_observability:
    external: true
    name: codestra-observability
